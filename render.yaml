# Render blueprint for the BlockSense API.
#
# Deploy with: New → Blueprint → point it at this repository. The API is a
# single bundled file, so the build needs nothing but Node and pnpm.
#
# The web app is deployed separately (Netlify). After the API is up, set
# VITE_API_BASE_URL on the web host to the API's public URL and redeploy, or
# the frontend will call its own origin and find nothing.

services:
  - type: web
    name: blocksense-api
    runtime: node
    plan: free
    region: oregon
    # Matches the build output of `pnpm --filter @blocksense/api run build`.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @blocksense/api run build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # One timeout governs every provider call, and a public endpoint is
      # regularly slower than a self-hosted node.
      - key: REQUEST_TIMEOUT_MS
        value: 25000
      # The deployed web origin. A comma-separated list is accepted; this
      # defaults to http://localhost:5173, which will not match the live site,
      # so the browser will block every request until this is set.
      - key: FRONTEND_URL
        sync: false
      # Public endpoints are used when these are unset, but they are rate
      # limited and will refuse requests. Setting them is the difference
      # between a demo and something a user can rely on.
      - key: ETHEREUM_RPC_URL
        sync: false
      - key: BNB_RPC_URL
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: BSCSCAN_API_KEY
        sync: false
      - key: TRON_API_KEY
        sync: false
      - key: MEMPOOL_API_KEY
        sync: false
