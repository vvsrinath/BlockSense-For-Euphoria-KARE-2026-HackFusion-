<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F9FC" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BlockSense" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="BlockSense" />
    <meta name="msapplication-TileColor" content="#0B1220" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="robots" content="index, follow" />

    <!-- Fonts: preconnected so the stylesheet request does not pay DNS+TLS,
         and loaded without blocking paint (see the note in styles/index.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'" />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    </noscript>

    <title>BlockSense — Crypto Transaction Intelligence</title>
    <meta
      name="description"
      content="BlockSense analyses on-chain transaction behaviour across Ethereum, BNB Chain, TRON, Solana and Bitcoin, and scores activity against a wallet's own history." />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/logo-mark.png" color="#2563EB" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BlockSense" />
    <meta property="og:title" content="BlockSense — Crypto Transaction Intelligence" />
    <meta
      property="og:description"
      content="Analyse on-chain transaction behaviour across five chains and score it against a wallet's own history." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BlockSense — Crypto Transaction Intelligence" />
    <meta
      name="twitter:description"
      content="Analyse on-chain transaction behaviour across five chains and score it against a wallet's own history." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
