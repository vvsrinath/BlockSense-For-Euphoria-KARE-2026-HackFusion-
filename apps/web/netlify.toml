# Site configuration for a Netlify site whose **base directory is `apps/web`**.
#
# Netlify only reads `netlify.toml` from the base directory, so a site pointed
# at `apps/web` ignores the root configuration entirely. Rather than making the
# base directory a thing you have to know about, this file provides the same
# setup expressed relative to this directory.
#
# `tests/netlifyConfig.test.ts` asserts the two files agree, so they cannot
# drift apart. If you change a redirect, change it in both.
#
# The recommended base directory is `/` (the repository root) and the root file
# is the one to edit; this exists so a site already configured with `apps/web`
# still deploys correctly.

[build]
  # The workspace root is two levels up, so pnpm has to install and build from
  # there. Installing from this directory would fetch only the web app's
  # dependencies and the API bundle would never be built, leaving the function
  # to fail at import.
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"
  functions = "../../netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_BUNDLER = "esbuild"

[functions]
  directory = "../../netlify/functions"
  node_bundler = "esbuild"

# Same rules as the root configuration, and in the same order. The /api rule
# must precede the SPA catch-all, or /api/v1/health is served index.html and the
# client renders HTML where it expects JSON.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
